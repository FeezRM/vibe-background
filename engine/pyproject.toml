[project]
name = "vibebg-engine"
version = "0.1.0"
description = "Video background replacement engine for Vibe Background"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
dependencies = [
    "diffusers>=0.32",
    "fastapi>=0.115",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.50",
    "uvicorn>=0.30",
]

[project.scripts]
vibebg = "vibebg_engine.cli:main"
vibebg-server = "vibebg_engine.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: renders real video through models (slow, needs fixtures)"]
